<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Les Petits Plats</title>

    <!-- polices de la maquette : Anton pour les titres, Manrope pour le texte -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- En-tete : photo de fond + logo + titre + barre de recherche -->
    <header class="header">
        <img src="src/Logo.png" alt="Les Petits Plats" class="header__logo">

        <div class="header__hero">
            <h1 class="header__title">Cherchez parmi plus de 1500 recettes du quotidien, simples et délicieuses</h1>

            <!-- barre de recherche principale (juste le visuel pour le moment) -->
            <form class="search" role="search">
                <input type="text" class="search__input" placeholder="Rechercher une recette, un ingrédient, ..." aria-label="Rechercher une recette">

                <!-- la croix pour vider le champ : cachee en CSS tant qu'on n'a rien tape.
                     type="reset" vide le champ tout seul, pas besoin de JS -->
                <button type="reset" class="search__clear" aria-label="Effacer">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                    </svg>
                </button>

                <button type="submit" class="search__btn" aria-label="Rechercher">
                    <!-- loupe dessinee en SVG, comme ca pas besoin d'image -->
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                        <circle cx="10" cy="10" r="7"></circle>
                        <line x1="15" y1="15" x2="21" y2="21"></line>
                    </svg>
                </button>
            </form>
        </div>
    </header>

</body>
</html>
