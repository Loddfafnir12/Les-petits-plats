<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <!-- viewport : sans cette ligne, le site s'afficherait "dezoome" sur mobile et le responsive ne marcherait pas -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Les Petits Plats</title>

    <!-- polices de la maquette : Anton pour les titres, Manrope pour le texte.
         preconnect ouvre la connexion aux serveurs Google en avance : la police arrive plus vite -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- En-tete : photo de fond + logo + titre + barre de recherche -->
    <header class="header">
        <img src="src/Logo.png" alt="Les Petits Plats" class="header__logo">

        <div class="header__hero">
            <!-- un seul h1 par page : c'est le titre principal (accessibilite et referencement) -->
            <h1 class="header__title">Cherchez parmi plus de 1500 recettes du quotidien, simples et délicieuses</h1>

            <!-- Barre de recherche principale (js/recherche.js).
                 role="search" signale la zone de recherche aux lecteurs d'ecran ;
                 aria-label remplace le label visible que la maquette n'a pas -->
            <form class="search" role="search">
                <input type="text" class="search__input" placeholder="Rechercher une recette, un ingrédient, ..." aria-label="Rechercher une recette">

                <!-- la croix : cachee en CSS tant que le champ est vide.
                     type="reset" vide le champ, et le JS relance le filtrage -->
                <button type="reset" class="search__clear" aria-label="Effacer">
                    <!-- aria-hidden : le dessin est decoratif, le lecteur d'ecran lit l'aria-label du bouton -->
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                    </svg>
                </button>

                <button type="submit" class="search__btn" aria-label="Rechercher">
                    <!-- loupe dessinee en SVG : nette a toutes les tailles, sans fichier image -->
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                        <circle cx="10" cy="10" r="7"></circle>
                        <line x1="15" y1="15" x2="21" y2="21"></line>
                    </svg>
                </button>
            </form>
        </div>
    </header>

    <main class="container">

        <!-- Barre de filtres : 3 menus deroulants + le nombre de recettes -->
        <div class="filters">
            <div class="filters__dropdowns">

                <!-- Menu Ingredients.
                     <details> / <summary> : menu deroulant natif, il s'ouvre et se ferme
                     au clic sans JS ; le navigateur ajoute l'attribut [open] quand il est ouvert -->
                <details class="dropdown">
                    <summary class="dropdown__summary">
                        Ingrédients
                        <svg class="dropdown__chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <polyline points="6 9 12 15 18 9"></polyline>
                        </svg>
                    </summary>
                    <div class="dropdown__panel">
                        <!-- petite recherche du menu : un <form> pour que la croix (reset) et la loupe (submit)
                             fonctionnent, et pour que la touche Entree declenche l'ajout du mot-cle.
                             placeholder=" " (un espace) : invisible, mais indispensable a l'astuce CSS
                             :placeholder-shown qui affiche la croix des qu'on tape -->
                        <form class="dropdown__search">
                            <input type="text" class="dropdown__input" placeholder=" " aria-label="Rechercher un ingrédient">
                            <button type="reset" class="dropdown__clear" aria-label="Effacer">
                                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                                    <line x1="6" y1="6" x2="18" y2="18"></line>
                                    <line x1="18" y1="6" x2="6" y2="18"></line>
                                </svg>
                            </button>
                            <!-- loupe (Group 4.svg de la maquette) : Entree ou clic = ajoute le 1er mot-cle qui correspond -->
                            <button type="submit" class="dropdown__loupe" aria-label="Ajouter le mot-clé">
                                <svg width="18" height="18" viewBox="0 0 14 14" fill="none" aria-hidden="true">
                                    <circle cx="5" cy="5" r="4.75" stroke="currentColor" stroke-width="0.5"></circle>
                                    <line x1="9.17678" y1="9.32322" x2="13.6768" y2="13.8232" stroke="currentColor" stroke-width="0.5"></line>
                                </svg>
                            </button>
                        </form>
                        <!-- liste vide ici : elle est remplie par le JS (configurerMenu dans js/filtres.js) -->
                        <ul class="dropdown__list" id="list-ingredients"></ul>
                    </div>
                </details>

                <!-- Menu Appareils : meme structure que le menu Ingredients -->
                <details class="dropdown">
                    <summary class="dropdown__summary">
                        Appareils
                        <svg class="dropdown__chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <polyline points="6 9 12 15 18 9"></polyline>
                        </svg>
                    </summary>
                    <div class="dropdown__panel">
                        <form class="dropdown__search">
                            <input type="text" class="dropdown__input" placeholder=" " aria-label="Rechercher un appareil">
                            <button type="reset" class="dropdown__clear" aria-label="Effacer">
                                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                                    <line x1="6" y1="6" x2="18" y2="18"></line>
                                    <line x1="18" y1="6" x2="6" y2="18"></line>
                                </svg>
                            </button>
                            <button type="submit" class="dropdown__loupe" aria-label="Ajouter le mot-clé">
                                <svg width="18" height="18" viewBox="0 0 14 14" fill="none" aria-hidden="true">
                                    <circle cx="5" cy="5" r="4.75" stroke="currentColor" stroke-width="0.5"></circle>
                                    <line x1="9.17678" y1="9.32322" x2="13.6768" y2="13.8232" stroke="currentColor" stroke-width="0.5"></line>
                                </svg>
                            </button>
                        </form>
                        <ul class="dropdown__list" id="list-appliances"></ul>
                    </div>
                </details>

                <!-- Menu Ustensiles : meme structure que le menu Ingredients -->
                <details class="dropdown">
                    <summary class="dropdown__summary">
                        Ustensiles
                        <svg class="dropdown__chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <polyline points="6 9 12 15 18 9"></polyline>
                        </svg>
                    </summary>
                    <div class="dropdown__panel">
                        <form class="dropdown__search">
                            <input type="text" class="dropdown__input" placeholder=" " aria-label="Rechercher un ustensile">
                            <button type="reset" class="dropdown__clear" aria-label="Effacer">
                                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                                    <line x1="6" y1="6" x2="18" y2="18"></line>
                                    <line x1="18" y1="6" x2="6" y2="18"></line>
                                </svg>
                            </button>
                            <button type="submit" class="dropdown__loupe" aria-label="Ajouter le mot-clé">
                                <svg width="18" height="18" viewBox="0 0 14 14" fill="none" aria-hidden="true">
                                    <circle cx="5" cy="5" r="4.75" stroke="currentColor" stroke-width="0.5"></circle>
                                    <line x1="9.17678" y1="9.32322" x2="13.6768" y2="13.8232" stroke="currentColor" stroke-width="0.5"></line>
                                </svg>
                            </button>
                        </form>
                        <ul class="dropdown__list" id="list-ustensils"></ul>
                    </div>
                </details>

            </div>

            <!-- "1500 recettes" est remplace par le vrai nombre des le chargement, puis a chaque recherche (js/cards.js) -->
            <p class="filters__count">1500 recettes</p>
        </div>

        <!-- zone des tags jaunes, remplie par js/tags.js -->
        <div class="tags" id="tags"></div>

        <!-- grille des cartes recettes, remplie par js/cards.js -->
        <div class="recettes" id="recettes"></div>

        <!-- message du scenario A1 : l'attribut hidden le cache, le JS l'enleve quand aucune recette ne correspond -->
        <p class="aucun-resultat" id="aucun-resultat" hidden></p>

    </main>

    <!-- Scripts en fin de body : le HTML est deja charge quand ils s'executent.
         L'ordre compte : d'abord les donnees, puis les fonctions, et index.js en dernier
         car c'est lui qui appelle toutes les autres fonctions.
         Ce sont des scripts classiques : ils partagent les memes variables globales. -->
    <script src="PetitsPlats2.0-main/PetitsPlats2.0-main/recipes.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/filtres.js"></script>
    <script src="js/tags.js"></script>
    <script src="js/cards.js"></script>
    <script src="js/recherche.js"></script>
    <script src="js/index.js"></script>

</body>
</html>
